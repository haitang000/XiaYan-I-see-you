worker_processes  auto;  # [性能优化] 由固定 1 改为 auto，自动匹配 CPU 核心数

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # [性能优化] 启用 open_file_cache，减少重复打开/关闭文件的磁盘 I/O
    # 原来：每次请求都重新打开文件描述符
    # 现在：缓存最近 1000 个文件的描述符，最长保留 20s，至少访问 2 次才缓存
    open_file_cache          max=1000 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # Gzip Settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    sendfile        on;
    tcp_nopush      on;   # [性能优化] 与 sendfile 配合，减少网络数据包数量
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # [性能优化] HTML 文件：no-cache（每次重验证），确保内容更新立即生效
        # 原来：HTML 没有单独的缓存规则，依赖默认行为（可能被 30d 规则覆盖）
        location ~* \.html$ {
            add_header Cache-Control "no-cache, must-revalidate";
            add_header Vary "Accept-Encoding";
        }

        # JSON 数据文件：短缓存，确保图片列表更新能较快生效
        location ~* \.json$ {
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        location / {
            try_files $uri $uri/ =404;
        }

        # [性能优化] 静态资源缓存：增加 immutable 指令
        # 原来：expires 30d + no-transform，浏览器到期后仍会发送条件请求验证
        # 现在：immutable 告知浏览器文件内容在有效期内绝对不会改变，跳过条件请求
        # 注意：仅对带内容哈希的文件名（如 xxx.abc123.js）适用 immutable；
        #       图片文件名不含哈希，但本站图片内容固定，30d immutable 是合理选择
        location ~* ^/image/.*\.(jpg|jpeg|png|gif|webp|ico|svg)$ {
            valid_referers server_names xiayan.icu *.xiayan.icu xiayan.haitang000.top *.xiayan.haitang000.top localhost 127.0.0.1;
            if ($invalid_referer) {
                return 403;
            }

            expires 30d;
            add_header Cache-Control "public, no-transform, immutable";
            access_log off;
        }

        location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform, immutable";
            access_log off;
        }

        # JS/CSS：较短缓存周期，方便更新迭代
        location ~* \.(css|js)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
            add_header Vary "Accept-Encoding";
        }

        error_page  404              /404.html;
        location = /404.html {
            root   /usr/share/nginx/html;
        }
    }
}
